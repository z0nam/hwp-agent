name: calver

# main 머지마다 날짜 버전 태그(vYYYY.MM.DD.N, KST)를 달고 그 태그로 Windows exe 를 빌드한다.
# 번호는 사람이 관리하지 않는다. jaix-kit 갱신 봇이 이 태그를 찾아 잠금을 올린다
# (https://github.com/jeju-inst/jaix-kit). 0.2.1 이 마지막 semver 태그다.

on:
  push:
    branches: [main]
    # 문서·테스트만 바뀐 머지는 사용자에게 달라지는 게 없어 태그·exe 빌드를 건너뛴다
    paths-ignore:
      - "docs/**"
      - "tests/**"
      - "README.md"

concurrency: calver-tag

jobs:
  tag:
    # 다른 저장소 코드가 이 저장소 태그 권한(contents: write)을 쥐므로 커밋으로 고정한다.
    # 올릴 때는 jaix-kit 의 새 커밋을 확인하고 PR 로.
    uses: jeju-inst/jaix-kit/.github/workflows/calver-tag.yml@ceb18e6bb8efdf0d92ed35f5f98fed2515453f5a
    permissions:
      contents: write

  # GITHUB_TOKEN 으로 단 태그는 windows-exe 의 `push: tags` 를 깨우지 않아 직접 부른다
  windows-exe:
    needs: tag
    if: needs.tag.outputs.created == 'true'   # 앞선 실행이 이미 태그·빌드한 커밋이면 건너뜀
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: gh workflow run windows-exe.yml -R "$GITHUB_REPOSITORY" --ref "$TAG"

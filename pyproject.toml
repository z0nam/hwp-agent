[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hwp-agent"
version = "0.1.0"
description = "Edit HWP/HWPX documents directly with AI, without a lossy DOCX round-trip."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Namun Cho" }]
keywords = ["hwp", "hwpx", "hancom", "document", "ai", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Text Processing :: Markup",
]
dependencies = [
    # Pure-Python HWPX read/write/validate.
    "python-hwpx>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
# Self-hosted HTTP server (`hwp-agent serve`): web UI + REST API + OpenAPI.
serve = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
]
# Local stdio MCP server (`hwp-agent mcp`) for Claude Desktop / Claude Code / Codex.
mcp = [
    "mcp>=1.2",
]

[project.scripts]
hwp-agent = "hwp_agent.cli.main:main"

[project.urls]
Homepage = "https://github.com/z0nam/hwp-agent"
Repository = "https://github.com/z0nam/hwp-agent"

[tool.hatch.build.targets.wheel]
packages = ["src/hwp_agent"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI idiom: File()/Form()/Header() in defaults (B008); inline HTML/CSS lines (E501).
"src/hwp_agent/server/app.py" = ["B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

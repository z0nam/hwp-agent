name: Build Windows exe

# Builds a standalone hwp-agent.exe (no Python needed by the user) with the
# converter jar bundled inside, and publishes it to the "windows-exe" release.
# Runs from calver.yml (dispatched for each automatic date tag vYYYY.MM.DD.N) or when you push
# a v* tag. Only tag runs stamp the version and publish; a manual run on a branch just builds
# and uploads the workflow artifact (pick a tag in "Use workflow from" to republish).
# A pull request that touches the installer or this workflow also builds, so the installer
# smoke test (silent install + uninstall) runs before merge; it never publishes.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "installer/**"
      - ".github/workflows/windows-exe.yml"

permissions:
  contents: write

# 빌드마다 같은 windows-exe 릴리스를 지우고 다시 만든다. 겹치면 늦게 끝난 옛 빌드가 새 파일을
# 덮거나 delete/create 가 경합하므로 한 번에 하나씩. 대기 중인 실행은 더 새 실행으로 갈아 끼워진다
# (릴리스에는 최신만 남으면 된다). 게시하지 않는 브랜치 빌드는 다른 그룹이라 대기 중인 태그 빌드를
# 밀어내지 않는다.
concurrency:
  group: windows-exe-${{ startsWith(github.ref, 'refs/tags/v') && 'release' || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch the converter jar (bundled into the exe)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path vendor | Out-Null
          Invoke-WebRequest `
            -Uri "https://github.com/z0nam/hwp-agent/releases/download/converter-jar/hwp2hwpx.jar" `
            -OutFile "vendor/hwp2hwpx.jar"

      # 소스의 버전은 0.0.0+dev 다. 태그로 빌드할 때만 태그 값(v 뗀 것, 예 2026.10.22.1 —
      # PEP 440·Inno 4자리 모두 유효)을 찍어 exe·설치기 --version 이 릴리스 번호를 말하게 한다.
      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".Substring(1)
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          function Stamp($path, $pattern, $repl) {
            $text = [IO.File]::ReadAllText($path)
            $new = [regex]::Replace($text, $pattern, $repl, 'Multiline')
            if ($new -eq $text) { throw "버전 자리를 못 찾음: $path" }
            [IO.File]::WriteAllText($path, $new, $utf8)
          }
          Stamp pyproject.toml '^version = ".*"' "version = `"$v`""
          Stamp src/hwp_agent/__init__.py '^__version__ = ".*"' "__version__ = `"$v`""
          Stamp installer/hwp-agent.iss '^#define AppVer ".*"' "#define AppVer `"$v`""
          Write-Host "version $v"

      - name: Install package + MCP + PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          # --collect-all mcp 가 mcp.cli 까지 import 하므로 그 의존성(typer 등)을 같이 깐다
          pip install ".[mcp]" "mcp[cli]>=1.2,<2" pyinstaller

      - name: Build single-file exe
        shell: pwsh
        run: |
          pyinstaller --onefile --name hwp-agent `
            --add-data "vendor/hwp2hwpx.jar;." `
            --collect-all hwpx `
            --collect-all lxml `
            --collect-all mcp `
            scripts/pyinstaller_entry.py

      - name: Smoke-test the exe
        shell: pwsh
        run: |
          .\dist\hwp-agent.exe --version
          .\dist\hwp-agent.exe setup --register claude,codex,gemini --dry-run

      # --- Build the bundled-JRE installer (so .hwp convert needs no separate Java) ---
      - name: Download Temurin JRE 17 (private, bundled into the installer)
        shell: pwsh
        run: |
          # JRE 21 — the converter jar is compiled with JDK 21 (class file v65)
          $url = "https://api.adoptium.net/v3/binary/latest/21/ga/windows/x64/jre/hotspot/normal/eclipse"
          Invoke-WebRequest -Uri $url -OutFile jre.zip
          Expand-Archive jre.zip -DestinationPath jre-extract -Force
          $top = Get-ChildItem jre-extract -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Force installer\payload | Out-Null
          Move-Item $top.FullName installer\payload\jre
          Copy-Item dist\hwp-agent.exe installer\payload\hwp-agent.exe
          # sanity: the bundled jre runs
          & installer\payload\jre\bin\java.exe -version

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\hwp-agent.iss
          Get-ChildItem installer\Output

      # The [Code] section only runs when the installer runs: ISCC accepts an unknown
      # constant like {userprofile} and the wizard then dies before its first page. Install
      # and uninstall once, silently, on the runner to catch that class of error.
      # The runner is set up as a jaix PC (#85): jaix's Codex entry, jar and rhwp in the
      # shared %LOCALAPPDATA%\hwp-agent must survive, and an exe the MCP client is still
      # running must not block the uninstall — while a same-named exe elsewhere keeps running.
      - name: Smoke-test installer (silent install + uninstall)
        shell: pwsh
        run: |
          $app = Join-Path $env:LOCALAPPDATA 'hwp-agent'
          $exe = Join-Path $app 'hwp-agent.exe'
          # a jaix PC: its folder, Claude Code + Codex present, jaix's uvx entry, jar and rhwp
          New-Item -ItemType Directory -Force (Join-Path $env:LOCALAPPDATA 'jaix'), "$HOME\.claude", "$HOME\.codex", "$app\rhwp" | Out-Null
          $codex = "$HOME\.codex\config.toml"
          Set-Content $codex "[mcp_servers.hwp-agent]`ncommand = `"uvx`"`nargs = [`"hwp-agent`", `"mcp`"]`n" -Encoding utf8
          Set-Content "$app\hwp2hwpx.jar" 'jaix jar'
          Set-Content "$app\rhwp\rhwp.exe" 'jaix rhwp'

          $p = Start-Process installer\Output\hwp-agent-setup.exe -Wait -PassThru `
            -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/LOG=setup.log'
          Get-Content setup.log -Tail 20
          if ($p.ExitCode -ne 0) { throw "installer exit $($p.ExitCode)" }
          if (-not (Test-Path $exe)) { throw "not installed: $exe" }
          & $exe --version
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if (($userPath -split ';') -notcontains $app) { throw "PATH not added: $userPath" }
          if ((Get-Content $codex -Raw) -notmatch 'command = "uvx"') { throw "jaix Codex entry overwritten on install:`n$(Get-Content $codex -Raw)" }

          # the MCP client is running this exe; an unrelated hwp-agent.exe elsewhere too
          function Start-Mcp($path) {
            $psi = New-Object System.Diagnostics.ProcessStartInfo $path, 'mcp'
            $psi.UseShellExecute = $false; $psi.RedirectStandardInput = $true  # stdin stays open
            [System.Diagnostics.Process]::Start($psi)
          }
          $other = Join-Path $env:RUNNER_TEMP 'other\hwp-agent.exe'
          New-Item -ItemType Directory -Force (Split-Path $other) | Out-Null
          Copy-Item $exe $other
          $running = Start-Mcp $exe; $keep = Start-Mcp $other
          Start-Sleep 8
          if ($running.HasExited -or $keep.HasExited) { throw "mcp exited before uninstall" }

          $u = Get-ChildItem $app -Filter 'unins*.exe' | Select -First 1
          $q = Start-Process $u.FullName -Wait -PassThru -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART'
          if ($q.ExitCode -ne 0) { throw "uninstaller exit $($q.ExitCode)" }
          Start-Sleep 3  # the uninstaller hands off to a temp copy that finishes the job

          if (Test-Path $exe) { throw "exe left behind (running process not stopped): $exe" }
          if ($keep.HasExited) { throw "an hwp-agent.exe outside {app} was stopped" }
          $keep.Kill()
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if (($userPath -split ';') -contains $app) { throw "PATH entry left behind: $userPath" }
          foreach ($f in "$app\hwp2hwpx.jar", "$app\rhwp\rhwp.exe") {
            if (-not (Test-Path $f)) { throw "jaix file removed by uninstall: $f" }
          }
          if ((Get-Content $codex -Raw) -notmatch 'command = "uvx"') { throw "jaix Codex entry removed on uninstall" }
          Write-Host "ok: jaix files and Codex entry kept, running exe stopped, PATH cleaned"

      - uses: actions/upload-artifact@v4
        with:
          name: hwp-agent-windows
          path: |
            dist/hwp-agent.exe
            installer/Output/hwp-agent-setup.exe

      # Only a tag build publishes. A manual run on a branch carries the 0.0.0+dev version,
      # so it stops at the workflow artifact above instead of replacing the public release.
      - name: Publish to the windows-exe release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete windows-exe --yes --cleanup-tag 2>$null
          gh release create windows-exe ".\dist\hwp-agent.exe" ".\installer\Output\hwp-agent-setup.exe" `
            --title "hwp-agent (Windows)" `
            --notes "Two downloads:`n- **hwp-agent-setup.exe** — recommended. Installer that bundles a private JRE, so .hwp -> .hwpx conversion works with no separate Java install. Per-user, no admin.`n- **hwp-agent.exe** — bare standalone exe (no Python). The converter jar is inside; needs a JRE 17+ only for `hwp-agent convert`.`nBuilt by .github/workflows/windows-exe.yml."
